basePath: /v1
definitions:
  cmd_api.AuthenticateTokenResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
    type: object
  cmd_api.CreateCommentPayload:
    properties:
      content:
        maxLength: 1000
        type: string
    required:
    - content
    type: object
  cmd_api.CreateConversationPayload:
    properties:
      other_user_id:
        type: integer
    required:
    - other_user_id
    type: object
  cmd_api.CreateMessagePayload:
    properties:
      content:
        maxLength: 5000
        type: string
    required:
    - content
    type: object
  cmd_api.CreatePostPayload:
    properties:
      content:
        maxLength: 1000
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 100
        type: string
    required:
    - content
    - title
    type: object
  cmd_api.CreateUserTokenPayload:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 3
        type: string
    required:
    - email
    - password
    type: object
  cmd_api.RegisterUserPayload:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 3
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - email
    - password
    - username
    type: object
  cmd_api.UpdatePostPayload:
    properties:
      content:
        maxLength: 1000
        type: string
      title:
        maxLength: 100
        type: string
    type: object
  cmd_api.UserWithToken:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
    type: object
  github_com_Ayushmangit_social_internal_store.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      post_id:
        type: integer
      user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
      user_id:
        type: integer
    type: object
  github_com_Ayushmangit_social_internal_store.Conversation:
    properties:
      created_at:
        type: string
      id:
        type: integer
      other_user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
      updated_at:
        type: string
    type: object
  github_com_Ayushmangit_social_internal_store.Message:
    properties:
      content:
        type: string
      conversation_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      sender:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
      sender_id:
        type: integer
    type: object
  github_com_Ayushmangit_social_internal_store.Post:
    properties:
      comment_count:
        type: integer
      comments:
        items:
          $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Comment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  github_com_Ayushmangit_social_internal_store.PostWithMetadata:
    properties:
      comment_count:
        type: integer
      comments:
        items:
          $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Comment'
        type: array
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
      user_id:
        type: integer
      version:
        type: integer
    type: object
  github_com_Ayushmangit_social_internal_store.Role:
    properties:
      description:
        type: string
      id:
        type: integer
      level:
        type: integer
      name:
        type: string
    type: object
  github_com_Ayushmangit_social_internal_store.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role:
        $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Role'
      role_id:
        type: integer
      username:
        type: string
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API for GopherSocial , a social network for gophers
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GopherSocial API
paths:
  /authentication/me:
    get:
      consumes:
      - application/json
      description: Returns user from context
      produces:
      - application/json
      responses:
        "200":
          description: Logged in user
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Returns user from context
      tags:
      - authentication
  /authentication/token:
    post:
      consumes:
      - application/json
      description: Creates a token for a user
      parameters:
      - description: User credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreateUserTokenPayload'
      produces:
      - application/json
      responses:
        "200":
          description: user credentials
          schema:
            $ref: '#/definitions/cmd_api.AuthenticateTokenResponse'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Creates a token
      tags:
      - authentication
  /authentication/user:
    post:
      consumes:
      - application/json
      description: Registers a user
      parameters:
      - description: User credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/cmd_api.RegisterUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: user registered
          schema:
            $ref: '#/definitions/cmd_api.UserWithToken'
        "400":
          description: Bad Request
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Registers a user
      tags:
      - authentication
  /conversations/:
    get:
      description: Returns all direct conversations belonging to the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Conversation'
            type: array
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get the current user's conversations
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Creates a direct conversation with another user, or returns the
        existing conversation.
      parameters:
      - description: Conversation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreateConversationPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Conversation'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Create or retrieve a direct conversation
      tags:
      - conversations
  /conversations/{conversationID}/messages/:
    get:
      description: Returns paginated message history for a conversation the authenticated
        user participates in.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: integer
      - description: Maximum messages to return (default 50, maximum 100)
        in: query
        name: limit
        type: integer
      - description: Return messages with IDs less than this ID
        in: query
        name: before_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Message'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Get conversation messages
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: Persists a message in a conversation where the authenticated user
        is a participant.
      parameters:
      - description: Conversation ID
        in: path
        name: conversationID
        required: true
        type: integer
      - description: Message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreateMessagePayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Message'
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Send a message
      tags:
      - conversations
  /health:
    get:
      consumes:
      - application/json
      description: Healthcheck
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Healthcheck
      tags:
      - health
  /posts/:
    post:
      consumes:
      - application/json
      description: Creates a post
      parameters:
      - description: Post create payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreatePostPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Post'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Creates a post
      tags:
      - posts
  /posts/{postID}:
    delete:
      consumes:
      - application/json
      description: Deletes a post by ID
      parameters:
      - description: post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Post Deleted
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Deletes a Post
      tags:
      - posts
    get:
      consumes:
      - application/json
      description: Fetches a post by ID
      parameters:
      - description: post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Post'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches a post
      tags:
      - posts
    patch:
      consumes:
      - application/json
      description: Updates a post by ID
      parameters:
      - description: post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Post update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.UpdatePostPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Post'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Updates a post
      tags:
      - posts
  /posts/{postID}/comment:
    post:
      consumes:
      - application/json
      description: Comments on a post with ID
      parameters:
      - description: post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: comment create payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.CreateCommentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.Comment'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Comment on a post
      tags:
      - comments
  /users/{userID}:
    get:
      consumes:
      - application/json
      description: Fetches a user profile by ID
      parameters:
      - description: user ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches a user profile
      tags:
      - users
  /users/{userID}/follow:
    put:
      consumes:
      - application/json
      description: Follows a user by ID
      parameters:
      - description: user ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: followed
        "404":
          description: Not Found
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Follows a user
      tags:
      - users
  /users/{userID}/unfollow:
    put:
      consumes:
      - application/json
      description: Unfollows a user by ID
      parameters:
      - description: user ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: unfollowed
        "404":
          description: Not Found
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Unfollows a user
      tags:
      - users
  /users/activate/{token}:
    put:
      description: Activates/Register a user by invitation token
      parameters:
      - description: invitation token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: user activated
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Activates/Register a user
      tags:
      - users
  /users/explore:
    get:
      consumes:
      - application/json
      description: Fetches all posts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.PostWithMetadata'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches all posts
      tags:
      - feed
  /users/feed:
    get:
      consumes:
      - application/json
      description: Fetches the user's feed
      parameters:
      - description: Since
        in: query
        name: since
        type: string
      - description: until
        in: query
        name: until
        type: string
      - default: 20
        description: Number of posts to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      - default: desc
        description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Tags
        in: query
        name: tags
        type: string
      - description: Search
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.PostWithMetadata'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Fetches the user feed
      tags:
      - feed
  /users/search:
    get:
      consumes:
      - application/json
      description: Searches for users by username
      parameters:
      - description: Username to search for
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Ayushmangit_social_internal_store.User'
            type: array
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Search users
      tags:
      - users
  /ws:
    get:
      description: Upgrades the HTTP connection to WebSocket using a short-lived,
        single-use ticket obtained from POST /ws/ticket.
      parameters:
      - description: Single-use WebSocket ticket
        in: query
        name: ticket
        required: true
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Invalid or expired ticket
          schema: {}
        "403":
          description: Origin not allowed
          schema: {}
      summary: Establish a WebSocket connection
      tags:
      - messaging
  /ws/ticket:
    post:
      description: Creates a short-lived, single-use ticket for an authenticated WebSocket
        connection.
      produces:
      - application/json
      responses:
        "201":
          description: WebSocket ticket created
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal server error
          schema: {}
      security:
      - ApiKeyAuth: []
      summary: Create a WebSocket ticket
      tags:
      - messaging
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
